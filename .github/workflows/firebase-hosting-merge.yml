name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run build
        env:
          CI: false
      - name: Deploy Live App to PokéSuite
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEDEX_32631 }}'
          channelId: live
          projectId: pokedex-32631
          target: pokesuite
          firebaseToolsVersion: '13.31.0'
      - name: Deploy Legacy Redirect to pokedex-32631
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEDEX_32631 }}'
          channelId: live
          projectId: pokedex-32631
          target: legacy
          firebaseToolsVersion: '13.31.0'
